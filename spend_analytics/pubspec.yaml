name: spend_analytics
description: SpendSense - modern offline-first expense tracking.
publish_to: "none"
version: 2.0.0+11

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management / DI / Routing
  get: ^4.7.2

  # Backend & Auth
  supabase_flutter: ^2.9.1
  google_sign_in: ^6.3.0

  # Local Database (offline-first)
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39

  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Charts
  fl_chart: ^0.68.0

  # Home Widget
  home_widget: ^0.7.0+1

  # Media
  image_picker: ^1.2.0

  # Export
  pdf: ^3.11.3
  csv: ^6.0.0

  # Utilities
  envified: 3.3.0
  intl: ^0.19.0
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  uuid: ^4.5.1

  # Monetization
  purchases_flutter: ^9.12.3
  firebase_auth: ^5.7.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/sp_logo.png"
  adaptive_icon_background: "assets/images/logo_back.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/env/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 900
