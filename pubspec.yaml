name: spend_analytics
description: SpendSense - modern offline-first expense tracking.
publish_to: "none"
version: 3.0.0+13

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (GetX — being replaced in v4, kept until Phase 7)
  get: ^4.7.2

  # State Management v4 (BLoC/Cubit)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation v4
  go_router: ^17.3.0

  # Dependency Injection v4
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Local Storage v4 (Hive CE — replaces Drift in Phase 7)
  hive_ce: ^2.9.1
  hive_ce_flutter: ^2.1.0
  flutter_secure_storage: ^10.3.1 # AES key storage for Hive encryption

  # Domain / Error handling
  dartz: ^0.10.1 # Either<Failure, T>
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Backend & Auth (Supabase — being replaced in Phase 6, kept until then)
  supabase_flutter: ^2.9.1
  google_sign_in: ^7.2.0

  # Firebase v4 additions (Auth, Firestore, Storage, Remote Config, FCM, Performance)
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_remote_config: ^6.5.2
  firebase_messaging: ^16.3.0
  firebase_performance: ^0.11.4+2

  # Local Database (Drift/SQLite — kept until Phase 7 for DataMigrationService)
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0+eol

  # Firebase (existing)
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  firebase_crashlytics: ^5.2.3

  # Monetization v4 (replaces purchases_flutter in Phase 5)
  in_app_purchase: ^3.2.0
  razorpay_flutter: ^1.3.7

  # Notifications
  flutter_local_notifications: ^22.0.0

  # Charts
  fl_chart: ^1.2.0

  # Home Widget
  home_widget: ^0.9.3

  # Voice Input
  speech_to_text: ^7.4.0
  local_auth: ^3.0.1

  # Media
  image_picker: ^1.2.0

  # Export
  pdf: ^3.11.3
  csv: ^8.0.0

  # Utilities
  envified: ^3.3.0
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  lottie: ^3.3.1
  uuid: ^4.5.1
  google_fonts: ^8.1.0

  # Monetization
  purchases_flutter: ^10.2.2

  # Responsiveness
  screenx: ^1.0.0

  # File sharing (CSV export)
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  flutter_svg: ^2.3.0
  upgrader: ^13.4.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/spend_analytics_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.14.4
  # v4 code generation
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.2
  hive_ce_generator: ^1.8.1
  # v4 testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/env/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 900
